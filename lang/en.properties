help.header=Working with the diagram · F1
help.text=Block: drag the body. Link: blue dot → green input.\nMiddle mouse button — pan the canvas. Ctrl+wheel — zoom at the cursor.\nHome — fit the diagram. Alt+↑ — parent folder.\nArrows — move by 12 px; Shift+arrows — by 1 px.\nCtrl+D — copy, Delete — remove, Ctrl+Z/Y — history, Ctrl+S — save.\nEsc — cancel a link. Search: the tab on the left, Enter — go.\nOptions → Settings: themes, grid, snapping, values and the refresh interval in ms.\nOptions → Project: template library, import/export and saving the selection.\nOptions → Device: manifests, comparison and the journal after a failure.\nProject changes are sent to the device only via “Apply…”.
